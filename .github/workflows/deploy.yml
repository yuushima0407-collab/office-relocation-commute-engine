name: Deploy

on:
  push:
    branches: [main]

# OIDCで一時クレデンシャルを受け取るために必要
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: cest-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend (with dev deps) and run tests
        working-directory: cest
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::697629627446:role/cest-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        working-directory: cest
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply (Lambda function only)
        # CIロールにはIAM/OIDCプロバイダを触る権限を渡していない（自分の権限を自分で
        # 書き換えられる状態を避けるため）。IAMロールやOIDC設定自体を変える場合は、
        # 人間が手元/CloudShellから `terraform apply` をフル実行する運用とする。
        working-directory: infra
        run: terraform apply -auto-approve -target=aws_lambda_function.cest_api -var="image_tag=${{ steps.vars.outputs.tag }}"

      - name: Read API endpoint from Terraform
        id: tf-out
        working-directory: infra
        run: echo "endpoint=$(terraform output -raw api_gateway_endpoint)" >> "$GITHUB_OUTPUT"

      - name: Prepare frontend assets
        run: |
          # station_master.jsonはバックエンド側を正として、デプロイ時にフロント用にコピーする
          cp cest/src/cest/data/station_master.json web/station_master.json
          # ソースにはプレースホルダーのまま残し、デプロイ時だけ本物のURLに置き換える
          # ソース側の 'https://API_GATEWAY_PLACEHOLDER' はhttps://を含んだ状態で書かれていて、
          # terraform outputのendpointも https:// を含む完全なURLなので、
          # 'https://API_GATEWAY_PLACEHOLDER' ごと置き換えないと https:// が二重になる
          sed -i "s|https://API_GATEWAY_PLACEHOLDER|${{ steps.tf-out.outputs.endpoint }}|" web/index.html

      - name: Sync frontend to S3
        run: aws s3 sync web/ s3://cest-frontend-yuki-shimada-2026/ --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E247BPAWME19P9 --paths "/*"
